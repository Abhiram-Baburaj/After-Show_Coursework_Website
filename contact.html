<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - After Show</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a class="logo" href="index.html">After Show</a>
        <nav>
            <div class="navbarButton"><a href="index.html" class="fillbtn">HOME</a></div>
            <div class="navbarButton"><a href="reviews.html" class="fillbtn">REVIEWS</a></div>
            <div class="navbarButton"><a href="about.html" class="fillbtn">ABOUT</a></div>
            <div class="navbarButton"><a href="contact.html" class="fillbtn">CONTACT</a></div>
            <div class="navbarButton"><a href="credits.html" class="fillbtn">CREDITS</a></div>
        </nav>
    </header>
    <div class="contact-section">
        <div class="content-card" style="padding: 40px;">
            <h1>Get in Touch</h1>
            <p style="text-align: center; color: #ffffff;">Have a movie recommendation or feedback? Drop a message below.</p>
            <form>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="your.email@example.com">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Type your message here"></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>
    <footer>
        <p>After Show · Movies are better when we talk about them.</p>
    </footer>
</body>
</html>
